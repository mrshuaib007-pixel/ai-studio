
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#0b1020;color:white;
font-family:Arial,sans-serif;min-height:100vh;
display:flex;align-items:center;justify-content:center;
}
.container{width:90%;max-width:850px;text-align:center}
.logo{font-size:42px;margin-bottom:12px}
h1{font-size:42px;margin:10px}
h1 span{color:#9b87ff}
.subtitle{color:#9ba4bd;margin-bottom:35px}
.panel{
background:#151c30;border:1px solid #303a55;
padding:24px;border-radius:18px;text-align:left
}
label{display:block;margin-bottom:12px;color:#c5cce0}
textarea{
width:100%;height:140px;background:#0b1020;
border:1px solid #35415f;border-radius:12px;
padding:15px;color:white;font-size:16px;resize:vertical
}
button{
margin-top:15px;padding:13px 24px;border:0;
border-radius:10px;background:#8065f5;color:white;
font-weight:bold;font-size:15px;cursor:pointer
}
button:hover{background:#9b87ff}
#output{
margin-top:20px;padding:18px;background:#0b1020;
border-radius:12px;min-height:65px;white-space:pre-wrap;
color:#dce2f5
}
.footer{color:#707b98;margin-top:25px;font-size:13px}
</style>
</head>
<body>
<div class="container">
<div class="logo">✦</div>
<h1>Welcome to <span>AI Studio</span></h1>
<p class="subtitle">Your creative AI workspace starts here.</p>
<div class="panel">
<label for="prompt">What would you like to create?</label>
<textarea id="prompt" placeholder="Write your idea here..."></textarea>
<button onclick="generate()">Generate Idea</button>
<div id="output">Your generated idea will appear here.</div>
</div>
<p class="footer">AI Studio · Version 1.0</p>
</div>
<script>
function generate(){
const prompt=document.getElementById("prompt").value.trim();
const output=document.getElementById("output");
if(!prompt){
output.textContent="Please enter your idea first.";
return;
}
output.textContent="Your idea: "+prompt+
"\n\nYour AI Studio workspace is ready. AI API connection will be added in the next version.";
}
</script>
</body>
</html>
